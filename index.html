<body class="bg-paper font-body min-h-screen pb-20">

    <nav class="bg-ink text-paper py-4 px-4 sticky top-0 z-50 shadow-md">
        <div class="max-w-5xl mx-auto flex justify-between items-center">
            <a href="index.html" class="font-header text-xl">← Back to Hub</a>
            <button id="submit-btn" onclick="submitExam()" class="hidden bg-accent text-white px-6 py-2 rounded-xl font-bold">SUBMIT EXAM</button>
        </div>
    </nav>

    <main class="max-w-4xl mx-auto px-4 mt-10">
        <div id="onboarding" class="max-w-md mx-auto text-center py-10">

        </div>

        <div id="quiz-container" class="hidden space-y-12"></div>

        <div id="results-view" class="hidden text-center py-10">

                <button onclick="downloadPDF()" class="bg-accent text-white px-8 py-3 rounded-full font-bold">Download Mistake Log (PDF)</button>
            </div>
            <div id="review-mount" class="text-left space-y-6"></div>
        </div>
    </main>

    <script>

            // [1-35: Grammar & Structure]

            // [36-60: Vocabulary]

        ];

        const FORMSPREE_ID = "mbdwjqnj";
        let studentName = "";
        let userAnswers = {};
        const urlParams = new URLSearchParams(window.location.search);
        const mode = urlParams.get('mode');

        function begin() {
            studentName = document.getElementById('student-name').value.trim();
            if(!studentName) return alert("Please enter your name.");
            document.getElementById('onboarding').classList.add('hidden');
            document.getElementById('quiz-container').classList.remove('hidden');
            document.getElementById('submit-btn').classList.remove('hidden');
            renderQuestions();
        }

        function renderQuestions() {
            const mount = document.getElementById('quiz-container');
            const data = mode === 'full' ? QUESTIONS : QUESTIONS.slice(0, 35);
            mount.innerHTML = data.map(q => `
                <div class="bg-white p-10 rounded-[2rem] border border-gray-100 shadow-sm">
                    <span class="text-xs font-bold text-accent uppercase tracking-widest">${q.cat}</span>
                    <p class="text-xl mt-2 mb-6">${q.id}. ${q.q}</p>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        ${q.options.map((o, i) => {
                            const L = String.fromCharCode(65+i);
                            return `<button onclick="pick(${q.id}, '${L}')" id="q${q.id}-${L}" 
                                    class="text-left p-4 border-2 rounded-xl hover:border-accent flex items-center transition-all">
                                    <span class="w-8 h-8 flex items-center justify-center rounded-full bg-paper mr-3 font-bold border">${L}</span> ${o}
                                    </button>`;
                        }).join('')}
                    </div>
                </div>
            `).join('');
        }

        function pick(qid, letter) {
            ['A','B','C','D'].forEach(l => {
                const el = document.getElementById(`q${qid}-${l}`);
                if(el) { el.style.backgroundColor = 'white'; el.style.color = '#1a1a2e'; }
            });
            const sel = document.getElementById(`q${qid}-${letter}`);
            sel.style.backgroundColor = '#1a1a2e';
            sel.style.color = 'white';
            userAnswers[qid] = letter;
        }

        async function submitExam() {
            if(!confirm("Submit answers?")) return;
            const data = mode === 'full' ? QUESTIONS : QUESTIONS.slice(0, 35);
            let score = 0;
            const mistakeLog = [];

            data.forEach(q => {
                const userChoice = userAnswers[q.id] || "None";
                if(userChoice === q.ans) score++;
                else mistakeLog.push({ id: q.id, u: userChoice, r: q.ans });
            });

            document.getElementById('quiz-container').classList.add('hidden');
            document.getElementById('submit-btn').classList.add('hidden');
            document.getElementById('results-view').classList.remove('hidden');
            document.getElementById('final-score').innerText = `${score} / ${data.length}`;
            
            document.getElementById('review-mount').innerHTML = data.map(q => {
                const ok = userAnswers[q.id] === q.ans;
                return `<div class="p-6 rounded-2xl ${ok ? 'correct-bg' : 'incorrect-bg'}">
                        <p class="font-bold">Q${q.id}: ${q.q}</p>
                        <p class="text-sm">You: ${userAnswers[q.id]||'None'} | Correct: ${q.ans}</p>
                        <p class="text-xs italic mt-2">Feedback: ${q.exp}</p>
                    </div>`;
            }).join('');

            const mistakeStr = mistakeLog.map(m => `Q${m.id}: chose ${m.u}(correct:${m.r})`).join(' | ');
            try {
                await fetch(`https://formspree.io/f/${FORMSPREE_ID}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name: studentName, score: `${score}/${data.length}`, mistakes: mistakeStr })
                });
            } catch (e) { console.error("Sync failed"); }
            window.scrollTo(0,0);
        }

        function downloadPDF() {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            let y = 20;
            doc.setFontSize(16);
            doc.text(`SWU-SET Results: ${studentName}`, 20, y);
            y += 15;
            doc.text(`Score: ${document.getElementById('final-score').innerText}`, 20, y);
            y += 20;
            const data = mode === 'full' ? QUESTIONS : QUESTIONS.slice(0, 35);
            data.forEach(q => {
                if(userAnswers[q.id] !== q.ans) {
                    if (y > 270) { doc.addPage(); y = 20; }
                    doc.text(`Q${q.id}: Chosen ${userAnswers[q.id]||'N/A'} (Correct: ${q.ans})`, 20, y);
                    y += 10;
                }
            });
            doc.save(`${studentName}_Results.pdf`);
        }
    </script>
</body>
</html>
