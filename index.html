<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Practice Portal | Assessment System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Source+Serif+4:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root { --ink: #1a1a2e; --paper: #faf8f4; --accent: #c8963e; --rule: #e0d9cf; }
        body { font-family: 'Source Serif 4', serif; background: var(--paper); color: var(--ink); margin: 0; }
        .font-display { font-family: 'Playfair Display', serif; }
        .test-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 24px; }
        .test-card { background: white; border: 1px solid var(--rule); padding: 24px; border-radius: 8px; transition: all 0.3s; }
        .test-card:hover { transform: translateY(-4px); box-shadow: 0 12px 24px rgba(0,0,0,0.1); border-color: var(--accent); }
        .screen { display: none; }
        .screen.active { display: block; }
        .option-btn { width: 100%; text-align: left; padding: 12px 16px; border-bottom: 1px solid var(--rule); transition: 0.2s; cursor: pointer; }
        .option-btn.selected { background: var(--accent); color: white; }
        .correction { background: #fdf3e0; border-left: 4px solid var(--accent); padding: 15px; margin: 10px 0; font-size: 0.9rem; }
    </style>
</head>
<body>

<div id="app" class="max-w-5xl mx-auto px-6 py-10">
    <header class="flex justify-between items-center pb-6 mb-10 border-b border-[#e0d9cf]">
        <div>
            <h1 class="font-display text-3xl">Practice Library</h1>
            <p class="text-sm text-gray-500 uppercase tracking-widest">Select a test to begin</p>
        </div>
        <button onclick="showScreen('admin-login')" class="text-xs text-gray-400 hover:text-black">Admin Settings</button>
    </header>

    <div id="screen-selector" class="screen active">
        <div class="test-grid" id="library-container"></div>
    </div>

    <div id="screen-admin-login" class="screen py-20 text-center">
        <div class="max-w-xs mx-auto border p-10 bg-white rounded shadow-sm">
            <h2 class="font-display text-2xl mb-6">Admin Access</h2>
            <input type="password" id="admin-pass" placeholder="Password" class="border w-full p-2 mb-4 text-center">
            <button onclick="checkAdmin()" class="bg-black text-white w-full p-2 rounded mb-4">Login</button>
            <button onclick="showScreen('selector')" class="text-sm text-gray-500 hover:underline">← Return to Library</button>
        </div>
    </div>

    <div id="screen-start" class="screen text-center py-20">
        <h2 class="font-display text-4xl mb-4" id="active-test-title"></h2>
        <input type="text" id="student-name" placeholder="Enter Your Name" class="border p-4 w-80 rounded mb-4 block mx-auto text-center">
        <button onclick="beginExam()" class="bg-[#1a1a2e] text-[#e8b96a] px-10 py-4 rounded font-bold">Start Test</button>
    </div>

    <div id="screen-exam" class="screen">
        <div id="questions-container" class="max-w-2xl mx-auto"></div>
        <button onclick="submitExam()" class="w-full bg-[#1a1a2e] text-white p-5 rounded font-bold mt-10">Submit Answers</button>
    </div>

    <div id="screen-results" class="screen max-w-2xl mx-auto">
        <div class="text-center mb-10">
            <h2 class="font-display text-5xl mb-2" id="final-score"></h2>
            <p class="text-xl text-gray-600" id="final-grade"></p>
        </div>
        <div id="review-container"></div>
        <button onclick="location.reload()" class="w-full mt-10 border border-black p-4 rounded">Finish & Return</button>
    </div>

    <div id="screen-admin" class="screen">
        <h2 class="font-display text-3xl mb-8">Admin Dashboard</h2>
        <div class="bg-white border p-6 rounded">
            <h3 class="font-bold mb-4">Recent Submissions (Local)</h3>
            <table class="w-full text-left">
                <thead><tr><th class="pb-2">Name</th><th class="pb-2">Score</th><th class="pb-2">Date</th></tr></thead>
                <tbody id="admin-results-table"></tbody>
            </table>
            <button onclick="localStorage.clear(); location.reload();" class="mt-8 text-xs text-red-500 hover:underline">Clear All Local Data</button>
        </div>
        <button onclick="showScreen('selector')" class="mt-6 text-blue-600 hover:underline">Back to Student View</button>
    </div>
</div>

<script>
    // FIX: Added missing commas and corrected the array structure
    const TEST_1_QUESTIONS = [
        { "id": 1, "text": "The manager suggested that the meeting ________ until next week.", "options": ["postpone", "be postponed", "postponed", "postpones"], "answer": "B", "explanation": "After 'suggest,' we use the subjunctive 'be' + past participle for passive voice.", "category": "Grammar" },
        { "id": 2, "text": "It’s high time the team ________ the new project proposal.", "options": ["submit", "submitted", "will submit", "submitting"], "answer": "B", "explanation": "'It's high time' is followed by the Past Simple.", "category": "Grammar" },
        { "id": 3, "text": "You ________ better check the data visualization in Tableau before the presentation.", "options": ["should", "would", "had", "must"], "answer": "C", "explanation": "The specific idiom for strong advice is 'had better'.", "category": "Functional Language" },
        { "id": 4, "text": "I am looking forward to ________ the new curriculum next semester.", "options": ["implement", "implementing", "implemented", "to implement"], "answer": "B", "explanation": "'Look forward to' requires the gerund (-ing) form.", "category": "Grammar" },
        { "id": 5, "text": "The student asked the advisor where ________ the capstone project files.", "options": ["did he put", "he had put", "had he put", "does he put"], "answer": "B", "explanation": "Reported speech uses statement word order.", "category": "Grammar" },
        { "id": 6, "text": "The witness gave an ________ account of the events, confusing the jury.", "options": ["explicit", "ambiguous", "lucid", "detailed"], "answer": "B", "explanation": "'Ambiguous' means open to more than one interpretation.", "category": "Vocabulary" },
        { "id": 7, "text": "The community showed a ________ spirit by rebuilding shortly after the flood.", "options": ["fragile", "resilient", "despondent", "stubborn"], "answer": "B", "explanation": "'Resilient' means able to recover quickly from difficult conditions.", "category": "Vocabulary" },
        { "id": 8, "text": "The whisper was barely ________ even in the silent room.", "options": ["visible", "audible", "tangible", "edible"], "answer": "B", "explanation": "'Audible' means able to be heard.", "category": "Vocabulary" },
        { "id": 9, "text": "With the advent of smartphones, pagers have become ________.", "options": ["trendy", "obsolete", "essential", "innovative"], "answer": "B", "explanation": "'Obsolete' means no longer produced or used.", "category": "Vocabulary" },
        { "id": 10, "text": "The theory was ________ by several peer-reviewed studies.", "options": ["refuted", "corroborated", "ignored", "questioned"], "answer": "B", "explanation": "'Corroborated' means confirmed or gave support to.", "category": "Vocabulary" }
    ];

    let db = {
        test_1: { title: "Practice Test 1", questions: TEST_1_QUESTIONS }
    };

    let session = { activeTest: null, studentName: "", answers: {} };

    function init() { renderLibrary(); }

    function renderLibrary() {
        const container = document.getElementById('library-container');
        container.innerHTML = Object.keys(db).map(key => `
            <div class="test-card">
                <h3 class="font-display text-xl">${db[key].title}</h3>
                <p class="text-xs text-gray-500 mt-1">✓ ${db[key].questions.length} Questions Ready</p>
                <button onclick="prepareExam('${key}')" class="mt-6 bg-black text-white px-4 py-2 rounded w-full text-sm">Open Test</button>
            </div>`).join('');
    }

    function showScreen(id) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById('screen-' + id).classList.add('active');
        if(id === 'admin') renderAdminResults();
        window.scrollTo(0,0);
    }

    function checkAdmin() {
        if (document.getElementById('admin-pass').value === 'admin123') showScreen('admin');
        else alert("Incorrect Password");
    }

    function renderAdminResults() {
        const results = JSON.parse(localStorage.getItem('atp_results') || '[]');
        const tbody = document.getElementById('admin-results-table');
        tbody.innerHTML = results.length ? '' : '<tr><td colspan="3" class="text-center text-gray-400 py-4">No results yet.</td></tr>';
        results.reverse().forEach(res => {
            tbody.innerHTML += `<tr class="border-t"><td class="py-2">${res.name}</td><td>${res.score}</td><td class="text-xs text-gray-400">${res.date}</td></tr>`;
        });
    }

    function prepareExam(key) {
        session.activeTest = key;
        document.getElementById('active-test-title').innerText = db[key].title;
        showScreen('start');
    }

    function beginExam() {
        session.studentName = document.getElementById('student-name').value;
        if (!session.studentName) return alert("Please enter your name");
        renderQuestions();
        showScreen('exam');
    }

    function renderQuestions() {
        const container = document.getElementById('questions-container');
        container.innerHTML = db[session.activeTest].questions.map((q, idx) => `
            <div class="mb-10">
                <div class="p-4 bg-gray-50 font-bold border-b mb-4">${idx + 1}. ${q.text}</div>
                <div id="q-${idx}">
                    ${q.options.map((opt, i) => `
                        <button onclick="handleSelect(${idx}, '${['A','B','C','D'][i]}')" class="option-btn" id="q-${idx}-${['A','B','C','D'][i]}">
                            <span class="mr-3 text-xs border px-2 py-1 rounded">${['A','B','C','D'][i]}</span> ${opt}
                        </button>`).join('')}
                </div>
            </div>`).join('');
    }

    function handleSelect(qIdx, letter) {
        session.answers[qIdx] = letter;
        document.querySelectorAll(`#q-${qIdx} .option-btn`).forEach(b => b.classList.remove('selected'));
        document.getElementById(`q-${qIdx}-${letter}`).classList.add('selected');
    }

    function submitExam() {
        const questions = db[session.activeTest].questions;
        let correctCount = 0;
        const review = document.getElementById('review-container');
        review.innerHTML = '';
        
        questions.forEach((q, idx) => {
            const isCorrect = session.answers[idx] === q.answer;
            if (isCorrect) correctCount++;
            review.innerHTML += `
                <div class="mb-6 border-b pb-4 ${isCorrect ? 'opacity-40' : ''}">
                    <p class="font-bold">${idx + 1}. ${q.text} ${isCorrect ? '✅' : '❌'}</p>
                    <p class="text-sm">Response: ${session.answers[idx] || 'No Answer'}</p>
                    ${!isCorrect ? `<div class="correction"><strong>Rule:</strong> ${q.explanation}</div>` : ''}
                </div>`;
        });

        const scoreString = `${correctCount}/${questions.length}`;
        document.getElementById('final-score').innerText = scoreString;
        document.getElementById('final-grade').innerText = (correctCount/questions.length >= 0.7) ? "Passed" : "Further Study Advised";

        const results = JSON.parse(localStorage.getItem('atp_results') || '[]');
        results.push({ name: session.studentName, score: scoreString, date: new Date().toLocaleString() });
        localStorage.setItem('atp_results', JSON.stringify(results));

        showScreen('results');
    }

    init();
</script>
</body>
</html>
