<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Practice Portal | Assessment System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Source+Serif+4:wght@400;600&family=JetBrains+Mono&display=swap" rel="stylesheet">
    <style>
        :root { --ink: #1a1a2e; --paper: #faf8f4; --accent: #c8963e; --rule: #e0d9cf; }
        body { font-family: 'Source Serif 4', serif; background: var(--paper); color: var(--ink); margin: 0; }
        .font-display { font-family: 'Playfair Display', serif; }
        .test-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 24px; }
        .test-card { background: white; border: 1px solid var(--rule); padding: 24px; border-radius: 8px; transition: all 0.3s; }
        .test-card.locked { opacity: 0.6; filter: grayscale(1); }
        .test-card.available:hover { transform: translateY(-4px); box-shadow: 0 12px 24px rgba(0,0,0,0.1); border-color: var(--accent); }
        .screen { display: none; }
        .screen.active { display: block; }
        .option-btn { width: 100%; text-align: left; padding: 12px 16px; border-bottom: 1px solid var(--rule); transition: 0.2s; }
        .option-btn.selected { background: var(--accent); color: white; }
        .correction { background: #fdf3e0; border-left: 4px solid var(--accent); padding: 15px; margin: 10px 0; font-size: 0.9rem; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid var(--rule); }
        th { background: #f8f9fa; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em; }
    </style>
</head>
<body>

<div id="app" class="max-w-5xl mx-auto px-6 py-10">
    
    <!-- HEADER -->
    <header class="flex justify-between items-center pb-6 mb-10 border-b border-[#e0d9cf]">
        <div>
            <h1 class="font-display text-3xl">Practice Library</h1>
            <p class="text-sm text-gray-500 uppercase tracking-widest">Select a test to begin</p>
        </div>
        <button onclick="showScreen('admin-login')" class="text-xs text-gray-400 hover:text-black">Admin Settings</button>
    </header>

    <!-- SCREEN: SELECTOR -->
    <div id="screen-selector" class="screen active">
        <div class="test-grid" id="library-container"></div>
    </div>

    <!-- SCREEN: ADMIN LOGIN -->
    <div id="screen-admin-login" class="screen py-20 text-center">
        <div class="max-w-xs mx-auto border p-10 bg-white rounded shadow-sm">
            <h2 class="font-display text-2xl mb-6">Admin Access</h2>
            <input type="password" id="admin-pass" placeholder="Password" class="border w-full p-2 mb-4 text-center">
            <button onclick="checkAdmin()" class="bg-black text-white w-full p-2 rounded mb-4">Login</button>
            <button onclick="showScreen('selector')" class="text-sm text-gray-500 hover:underline">← Return to Library</button>
        </div>
    </div>

    <!-- SCREEN: START EXAM -->
    <div id="screen-start" class="screen text-center py-20">
        <h2 class="font-display text-4xl mb-4" id="active-test-title"></h2>
        <input type="text" id="student-name" placeholder="Enter Your Name" class="border p-4 w-80 rounded mb-4 block mx-auto text-center">
        <button onclick="beginExam()" class="bg-[#1a1a2e] text-[#e8b96a] px-10 py-4 rounded font-bold">Start Test</button>
    </div>

    <!-- SCREEN: EXAM -->
    <div id="screen-exam" class="screen">
        <div id="questions-container" class="max-w-2xl mx-auto"></div>
        <button onclick="submitExam()" class="w-full bg-[#1a1a2e] text-white p-5 rounded font-bold mt-10">Submit Answers</button>
    </div>

    <!-- SCREEN: RESULTS (STUDENT VIEW) -->
    <div id="screen-results" class="screen max-w-2xl mx-auto">
        <div class="text-center mb-10">
            <h2 class="font-display text-5xl mb-2" id="final-score"></h2>
            <p class="text-xl text-gray-600" id="final-grade"></p>
        </div>
        <div id="review-container"></div>
        <button onclick="location.reload()" class="w-full mt-10 border border-black p-4 rounded">Finish & Return</button>
    </div>

    <!-- SCREEN: ADMIN DASHBOARD -->
    <div id="screen-admin" class="screen">
        <h2 class="font-display text-3xl mb-8">Admin Dashboard</h2>
        
        <!-- UPLOAD SECTION -->
        <div class="bg-white border p-6 rounded mb-8">
            <h3 class="font-bold mb-4">Upload Questions</h3>
            <select id="upload-target" class="border w-full p-2 mb-4">
                <option value="test_1">Practice Test 1</option>
                <option value="test_2">Practice Test 2</option>
                <option value="test_3">Practice Test 3</option>
            </select>
            <textarea id="json-input" rows="5" class="w-full border p-4 font-mono text-xs mb-4" placeholder='Paste JSON array here...'></textarea>
            <button onclick="processUpload()" class="bg-amber-600 text-white px-6 py-2 rounded">Unlock Test</button>
        </div>

        <!-- RESULTS SECTION -->
        <div class="bg-white border p-6 rounded mb-8">
            <h3 class="font-bold mb-4">Student Submissions</h3>
            <div class="overflow-x-auto">
                <table>
                    <thead>
                        <tr>
                            <th>Student Name</th>
                            <th>Test</th>
                            <th>Score</th>
                            <th>Date</th>
                        </tr>
                    </thead>
                    <tbody id="admin-results-table">
                        <!-- Rows rendered by JS -->
                    </tbody>
                </table>
            </div>
            <button onclick="clearAllData()" class="mt-4 text-xs text-red-500 hover:underline">Clear All Data</button>
        </div>

        <button onclick="showScreen('selector')" class="text-blue-600 hover:underline">Back to Student View</button>
    </div>
</div>

<script>
    let db = {
        test_1: { title: "Practice Test 1", questions: null },
        test_2: { title: "Practice Test 2", questions: null },
        test_3: { title: "Practice Test 3", questions: null }
    };

    let session = { activeTest: null, studentName: "", answers: {} };

    function init() {
        const saved = localStorage.getItem('atp_db');
        if (saved) db = JSON.parse(saved);
        renderLibrary();
    }

    function renderLibrary() {
        const container = document.getElementById('library-container');
        container.innerHTML = '';
        Object.keys(db).forEach(key => {
            const isLocked = db[key].questions === null;
            container.innerHTML += `
                <div class="test-card ${isLocked ? 'locked' : 'available'}">
                    <h3 class="font-display text-xl">${db[key].title}</h3>
                    <p class="text-xs text-gray-500 mt-1">${isLocked ? '🔒 Content Pending' : '✓ 100 Questions Ready'}</p>
                    ${!isLocked ? `<button onclick="prepareExam('${key}')" class="mt-6 bg-black text-white px-4 py-2 rounded w-full text-sm">Open Test</button>` : ''}
                </div>`;
        });
    }

    function showScreen(id) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById('screen-' + id).classList.add('active');
        if(id === 'admin') renderAdminResults();
        window.scrollTo(0,0);
    }

    function checkAdmin() {
        if (document.getElementById('admin-pass').value === 'admin123') showScreen('admin');
        else alert("Incorrect Password");
    }

    function processUpload() {
        const target = document.getElementById('upload-target').value;
        try {
            db[target].questions = JSON.parse(document.getElementById('json-input').value);
            localStorage.setItem('atp_db', JSON.stringify(db));
            alert("Test content updated!");
            renderLibrary();
            showScreen('selector');
        } catch(e) { alert("Format Error: Ensure your JSON is correct."); }
    }

    function renderAdminResults() {
        const results = JSON.parse(localStorage.getItem('atp_results') || '[]');
        const tbody = document.getElementById('admin-results-table');
        tbody.innerHTML = results.length ? '' : '<tr><td colspan="4" class="text-center text-gray-400 py-4">No results yet.</td></tr>';
        
        results.reverse().forEach(res => {
            tbody.innerHTML += `
                <tr>
                    <td class="font-bold">${res.name}</td>
                    <td>${res.testTitle}</td>
                    <td>${res.score}</td>
                    <td class="text-xs text-gray-400">${res.date}</td>
                </tr>`;
        });
    }

    function prepareExam(key) {
        session.activeTest = key;
        document.getElementById('active-test-title').innerText = db[key].title;
        showScreen('start');
    }

    function beginExam() {
        session.studentName = document.getElementById('student-name').value;
        if (!session.studentName) return alert("Please enter your name");
        renderQuestions();
        showScreen('exam');
    }

    function renderQuestions() {
        const container = document.getElementById('questions-container');
        container.innerHTML = '';
        db[session.activeTest].questions.forEach((q, idx) => {
            container.innerHTML += `
                <div class="question-card">
                    <div class="p-4 bg-gray-50 font-bold border-b">${idx + 1}. ${q.text}</div>
                    <div id="q-${idx}">
                        ${q.options.map((opt, i) => `
                            <button onclick="handleSelect(${idx}, '${['A','B','C','D'][i]}')" class="option-btn" id="q-${idx}-${['A','B','C','D'][i]}">
                                <span class="mr-3 text-xs border px-2 py-1 rounded">${['A','B','C','D'][i]}</span> ${opt}
                            </button>`).join('')}
                    </div>
                </div>`;
        });
    }

    function handleSelect(qIdx, letter) {
        session.answers[qIdx] = letter;
        document.querySelectorAll(`#q-${qIdx} .option-btn`).forEach(b => b.classList.remove('selected'));
        document.getElementById(`q-${qIdx}-${letter}`).classList.add('selected');
    }

    function submitExam() {
        const questions = db[session.activeTest].questions;
        let correctCount = 0;
        const review = document.getElementById('review-container');
        review.innerHTML = '';
        
        questions.forEach((q, idx) => {
            const isCorrect = session.answers[idx] === q.answer;
            if (isCorrect) correctCount++;
            review.innerHTML += `
                <div class="mb-6 border-b pb-4 ${isCorrect ? 'opacity-40' : ''}">
                    <p class="font-bold">${idx + 1}. ${q.text} ${isCorrect ? '✅' : '❌'}</p>
                    <p class="text-sm">Response: ${session.answers[idx] || 'No Answer'}</p>
                    ${!isCorrect ? `<div class="correction"><strong>Rule:</strong> ${q.explanation}</div>` : ''}
                </div>`;
        });

        const scoreString = `${correctCount}/${questions.length}`;
        document.getElementById('final-score').innerText = scoreString;
        document.getElementById('final-grade').innerText = (correctCount/questions.length >= 0.7) ? "Status: Passed" : "Status: Further Study Advised";

        // SAVE TO LOCALSTORAGE FOR ADMIN
        const results = JSON.parse(localStorage.getItem('atp_results') || '[]');
        results.push({
            name: session.studentName,
            testTitle: db[session.activeTest].title,
            score: scoreString,
            date: new Date().toLocaleString()
        });
        localStorage.setItem('atp_results', JSON.stringify(results));

        showScreen('results');
    }

    function clearAllData() {
        if(confirm("This will delete ALL student scores and ALL uploaded tests. Continue?")) {
            localStorage.clear();
            location.reload();
        }
    }

    init();
</script>
</body>
</html>
