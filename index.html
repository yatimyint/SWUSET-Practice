<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Practice Portal | Academic Assessment</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        ink: '#1a1a2e',
                        paper: '#faf8f4',
                        accent: '#c8963e',
                    },
                    fontFamily: {
                        header: ['Playfair Display', 'serif'],
                        body: ['Source Serif 4', 'serif'],
                    }
                }
            }
        }
    </script>

    <style>
        body { background-color: #faf8f4; color: #1a1a2e; font-family: 'Source Serif 4', serif; }
        .btn-option.selected { background-color: #1a1a2e; color: white; border-color: #1a1a2e; }
        .correct-bg { background-color: #dcfce7; border: 1px solid #166534; }
        .incorrect-bg { background-color: #fee2e2; border: 1px solid #991b1b; }
        .accent-border { border-bottom: 2px solid #c8963e; }
        .loader { border-top-color: #c8963e; animation: spinner 1.5s linear infinite; }
        @keyframes spinner { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="min-h-screen pb-12">

    <!-- Header -->
    <nav class="bg-ink text-paper py-6 px-4 shadow-lg mb-8">
        <div class="max-w-5xl mx-auto flex justify-between items-center">
            <h1 class="font-header text-2xl tracking-wide uppercase">Practice Portal</h1>
            <div id="student-display" class="hidden text-sm italic opacity-80"></div>
        </div>
    </nav>

    <main class="max-w-4xl mx-auto px-4">
        
        <!-- SECTION 1: Landing Page -->
        <section id="landing-page" class="space-y-6">
            <h2 class="font-header text-4xl mb-8 accent-border inline-block">Practice Library</h2>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div onclick="showOnboarding()" class="cursor-pointer border-2 border-ink p-6 rounded-lg hover:bg-white transition-all group shadow-sm">
                    <h3 class="font-header text-2xl mb-2 group-hover:text-accent transition-colors">Practice Test 1</h3>
                    <p class="text-gray-600 mb-4">Comprehensive Assessment: Grammar, Vocabulary, Functional Language, and Reading.</p>
                    <span class="inline-block bg-ink text-paper px-3 py-1 text-xs uppercase tracking-tighter">100 Questions</span>
                </div>
            </div>
        </section>

        <!-- SECTION 2: Onboarding -->
        <section id="onboarding" class="hidden max-w-md mx-auto bg-white p-8 rounded-lg shadow-xl border border-gray-200">
            <h2 class="font-header text-3xl mb-4 text-center">Student Entry</h2>
            <p class="text-center mb-6 text-gray-600">Please enter your full name to unlock the assessment.</p>
            <input type="text" id="student-name" placeholder="Full Name" 
                   class="w-full p-3 border-2 border-gray-200 rounded mb-4 focus:border-accent outline-none">
            <button id="start-btn" disabled 
                    class="w-full py-3 bg-gray-300 text-gray-500 rounded font-bold uppercase transition-all cursor-not-allowed">
                Start Test
            </button>
            <button onclick="hideOnboarding()" class="w-full mt-4 text-sm underline opacity-60">Back to Library</button>
        </section>

        <!-- SECTION 3: Exam Interface -->
        <section id="exam-interface" class="hidden">
            <div class="sticky top-0 bg-paper py-4 mb-8 border-b border-gray-200 z-10 flex justify-between items-center">
                <span class="font-header text-xl" id="current-user-tag"></span>
                <button onclick="submitExam()" class="bg-accent text-white px-8 py-2 rounded font-bold hover:brightness-90">SUBMIT EXAM</button>
            </div>
            <div id="questions-container" class="space-y-12"></div>
        </section>

        <!-- SECTION 4: Results & Review -->
        <section id="results-page" class="hidden">
            <div class="text-center mb-12 py-12 bg-white rounded-lg shadow-inner border-2 border-ink">
                <h2 class="font-header text-5xl mb-2">Final Score</h2>
                <div id="score-circle" class="text-6xl font-bold text-accent mb-4">0/100</div>
                <div id="submission-status" class="text-sm font-semibold italic text-gray-500">Sending results to instructor...</div>
            </div>

            <h3 class="font-header text-3xl mb-8 accent-border inline-block">Review Section</h3>
            <div id="review-container" class="space-y-8"></div>
            
            <div class="mt-12 text-center">
                <button onclick="location.reload()" class="bg-ink text-white px-10 py-4 rounded font-bold hover:opacity-90">RETURN TO HOME</button>
            </div>
        </section>

    </main>

    <script>
        // CONFIGURATION
        const FORMSPREE_ID = "mbdwjqnj"; 

        const TEST_1_DATA = [
            { "id": 1, "text": "The manager suggested that the meeting ________ until next week.", "options": ["postpone", "be postponed", "postponed", "postpones"], "answer": "B", "explanation": "After 'suggest,' we use the subjunctive 'be' + past participle for passive voice.", "category": "Grammar" },
            { "id": 2, "text": "It’s high time the team ________ the new project proposal.", "options": ["submit", "submitted", "will submit", "submitting"], "answer": "B", "explanation": "'It's high time' is followed by the Past Simple.", "category": "Grammar" },
            { "id": 3, "text": "You ________ better check the data visualization in Tableau before the presentation.", "options": ["should", "would", "had", "must"], "answer": "C", "explanation": "The specific idiom for strong advice is 'had better'.", "category": "Functional Language" },
            { "id": 4, "text": "I am looking forward to ________ the new curriculum next semester.", "options": ["implement", "implementing", "implemented", "to implement"], "answer": "B", "explanation": "'Look forward to' requires the gerund (-ing) form.", "category": "Grammar" },
            { "id": 5, "text": "The student asked the advisor where ________ the capstone project files.", "options": ["did he put", "he had put", "had he put", "does he put"], "answer": "B", "explanation": "Reported speech uses statement word order.", "category": "Grammar" },
            { "id": 6, "text": "The witness gave an ________ account of the events, confusing the jury.", "options": ["explicit", "ambiguous", "lucid", "detailed"], "answer": "B", "explanation": "'Ambiguous' means open to more than one interpretation; not having one obvious meaning.", "category": "Vocabulary" },
            { "id": 7, "text": "The community showed a ________ spirit by rebuilding shortly after the flood.", "options": ["fragile", "resilient", "despondent", "stubborn"], "answer": "B", "explanation": "'Resilient' means able to withstand or recover quickly from difficult conditions.", "category": "Vocabulary" },
            { "id": 8, "text": "The whisper was barely ________ even in the silent room.", "options": ["visible", "audible", "tangible", "edible"], "answer": "B", "explanation": "'Audible' means able to be heard.", "category": "Vocabulary" },
            { "id": 9, "text": "With the advent of smartphones, pagers have become ________.", "options": ["trendy", "obsolete", "essential", "innovative"], "answer": "B", "explanation": "'Obsolete' means no longer produced or used; out of date.", "category": "Vocabulary" },
            { "id": 10, "text": "The theory was ________ by several peer-reviewed studies.", "options": ["refuted", "corroborated", "ignored", "questioned"], "answer": "B", "explanation": "'Corroborated' means confirmed or gave support to a statement or theory.", "category": "Vocabulary" },
            { "id": 11, "text": "He is highly ________ in three different programming languages.", "options": ["interested", "proficient", "beginner", "confused"], "answer": "B", "explanation": "'Proficient' means competent or skilled in doing or using something.", "category": "Vocabulary" },
            { "id": 12, "text": "The scent of the spice was quite ________.", "options": ["sweet", "weak", "pungent", "pleasant"], "answer": "C", "explanation": "'Pungent' describes a sharp or strong smell or taste.", "category": "Vocabulary" },
            { "id": 13, "text": "She was ________ about moving to a new city alone.", "options": ["excited", "apprehensive", "confident", "bored"], "answer": "B", "explanation": "'Apprehensive' means anxious or fearful that something bad will happen.", "category": "Vocabulary" },
            { "id": 14, "text": "The stock market tends to ________ during times of political uncertainty.", "options": ["stay still", "rise only", "fluctuate", "drop only"], "answer": "C", "explanation": "'Fluctuate' means to rise and fall irregularly in number or amount.", "category": "Vocabulary" },
            { "id": 15, "text": "The museum features a ________ collection of ancient artifacts.", "options": ["limited", "diverse", "similar", "boring"], "answer": "B", "explanation": "'Diverse' means showing a great deal of variety; very different.", "category": "Vocabulary" },
            { "id": 16, "text": "The two departments worked in ________ to finish the project on time.", "options": ["competition", "isolation", "collaboration", "opposition"], "answer": "C", "explanation": "'Collaboration' means the action of working with someone to produce or create something.", "category": "Vocabulary" },
            { "id": 17, "text": "The clear water was so ________ that we could see the fish at the bottom.", "options": ["cloudy", "deep", "transparent", "cold"], "answer": "C", "explanation": "'Transparent' means allowing light to pass through so that objects behind can be distinctly seen.", "category": "Vocabulary" },
            { "id": 18, "text": "The company will ________ new safety measures starting next week.", "options": ["ignore", "implement", "design", "delay"], "answer": "B", "explanation": "'Implement' means to put a decision, plan, or agreement into effect.", "category": "Vocabulary" },
            { "id": 19, "text": "The charity received an ________ donation from an anonymous donor.", "options": ["selfish", "altruistic", "brave", "greedy"], "answer": "B", "explanation": "'Altruistic' means showing a disinterested and selfless concern for the well-being of others.", "category": "Vocabulary" },
            { "id": 20, "text": "The oil spill caused ________ damage to the local ecosystem.", "options": ["minor", "catastrophic", "beautiful", "expected"], "answer": "B", "explanation": "'Catastrophic' means involving or causing sudden great damage or suffering.", "category": "Vocabulary" },
            { "id": 21, "text": "The auditor will ________ the financial records for any discrepancies.", "options": ["sign", "scrutinize", "discard", "copy"], "answer": "B", "explanation": "'Scrutinize' means to examine or inspect closely and thoroughly.", "category": "Vocabulary" },
            { "id": 22, "text": "The drone of the engine was ________ and induced sleep.", "options": ["exciting", "monotonous", "loud", "short"], "answer": "B", "explanation": "'Monotonous' means dull, tedious, and repetitious; lacking in variety and interest.", "category": "Vocabulary" },
            { "id": 23, "text": "Elderly people are often more ________ to the effects of extreme heat.", "options": ["safe", "vulnerable", "strong", "wealthy"], "answer": "B", "explanation": "'Vulnerable' means exposed to the possibility of being attacked or harmed.", "category": "Vocabulary" },
            { "id": 24, "text": "The local government decided to ________ the funding for public schools.", "options": ["reduce", "maintain", "augment", "debate"], "answer": "C", "explanation": "'Augment' means to make something greater by adding to it; increase.", "category": "Vocabulary" },
            { "id": 25, "text": "The instructions were so ________ that even a child could follow them.", "options": ["ambiguous", "lucid", "confusing", "vague"], "answer": "B", "explanation": "'Lucid' means expressed clearly; easy to understand.", "category": "Vocabulary" },
            { "id": 26, "text": "Giving Advice: \"I'm worried about the upcoming board meeting.\"", "options": ["Don't be worried.", "Have you considered preparing a briefing note beforehand?", "Meetings are easy.", "Just relax."], "answer": "B", "explanation": "Suggesting a specific action with 'Have you considered...?' is a polite and professional way to give advice.", "category": "Functional Language" },
            { "id": 27, "text": "Asking for a Favor: \"I'm stuck in traffic. ________________ starting the presentation without me?\"", "options": ["Do you", "Would you mind", "Can you", "Will you"], "answer": "B", "explanation": "'Would you mind' followed by a gerund (-ing) is a standard polite way to ask for a favor.", "category": "Functional Language" },
            { "id": 28, "text": "Disagreeing Politely: \"I think we should move the deadline up by a week.\"", "options": ["No, that's impossible.", "I see where you’re coming from, but I’m concerned about the quality of the final output.", "You are wrong.", "That is a bad plan."], "answer": "B", "explanation": "Validating the other person's view before stating a counter-concern is the standard for polite disagreement.", "category": "Functional Language" },
            { "id": 29, "text": "Handling an Inquiry: \"Do you know if the IT supervisor is available?\"", "options": ["He is here.", "I’m not entirely sure; let me check his schedule for you.", "Ask someone else.", "He is busy."], "answer": "B", "explanation": "Offering to check information is a professional way to handle an inquiry when the answer isn't immediately known.", "category": "Functional Language" },
            { "id": 30, "text": "Expressing Certainty: \"Is the data visualization for the capstone project finished?\"", "options": ["I think so.", "I’m absolutely positive; I double-checked the dashboard this morning.", "Maybe.", "It could be."], "answer": "B", "explanation": "Providing a reason for certainty (e.g., 'I double-checked') reinforces the professional tone.", "category": "Functional Language" },
            { "id": 31, "text": "Expressing Regret: \"I apologize for the delay in the system update.\"", "options": ["It's okay.", "Please accept our apologies; we are working to resolve the issue as quickly as possible.", "Don't worry.", "It happens."], "answer": "B", "explanation": "Formal apologies in a professional context often include a statement of ongoing action to fix the problem.", "category": "Functional Language" },
            { "id": 32, "text": "Checking for Understanding: \"____________________?\" \"Yes, the instructions are quite lucid now.\"", "options": ["Do you get it?", "Does that clarify things for you?", "Are you following me?", "What did I say?"], "answer": "B", "explanation": "'Does that clarify things for you?' is a professional way to check if an explanation was successful.", "category": "Functional Language" },
            { "id": 33, "text": "Asking for an Opinion: \"What is your take on the new sustainability curriculum?\"", "options": ["I like it.", "I find the integration of UN SDGs to be very comprehensive.", "It is okay.", "I don't know."], "answer": "B", "explanation": "Providing a specific, professional reason for an opinion is preferred over simple 'like' or 'dislike'.", "category": "Functional Language" },
            { "id": 34, "text": "Offering Help: \"These spreadsheets look very complex.\"", "options": ["Yes, they are.", "Would you like some assistance with the data entry?", "Be careful with them.", "I am good at Excel."], "answer": "B", "explanation": "Offering specific assistance ('assistance with data entry') is more professional than a general comment.", "category": "Functional Language" },
            { "id": 35, "text": "Responding to Thanks: \"Thank you for providing the university admissions information.\"", "options": ["No problem.", "You're very welcome.", "It was my pleasure to assist.", "Both B and C."], "answer": "D", "explanation": "Both 'You're very welcome' and 'It was my pleasure' are standard formal responses to thanks.", "category": "Functional Language" },
            { "id": 36, "text": "Interrupting Formally: \"________________, but could I just add a point about the budget?\"", "options": ["Excuse me", "If I could just interject for a moment", "Listen to me", "Hey!"], "answer": "B", "explanation": "'If I could just interject...' is a polite way to enter a conversation in a meeting.", "category": "Functional Language" },
            { "id": 37, "text": "Giving an Excuse: \"Why was the Campus Connect platform offline yesterday?\"", "options": ["It was offline.", "I apologize; we encountered an unexpected server issue during the update.", "Don't ask me.", "It’s fixed now."], "answer": "B", "explanation": "A professional excuse should be polite and provide a brief, factual reason for the problem.", "category": "Functional Language" },
            { "id": 38, "text": "Accepting a Suggestion: \"Why don't we use Tableau for the next report?\"", "options": ["Tableau is software.", "That sounds like an excellent suggestion!", "I don't mind.", "Maybe later."], "answer": "B", "explanation": "Enthusiastic but professional acceptance helps build workplace collaboration.", "category": "Functional Language" },
            { "id": 39, "text": "Declining an Invitation: \"Are you joining us for the staff dinner tonight?\"", "options": ["I hate dinners.", "I’d love to, but unfortunately, I have a prior commitment.", "No, I'm going home.", "I can't."], "answer": "B", "explanation": "Declining with 'I'd love to, but...' followed by a polite reason is the standard professional social norm.", "category": "Functional Language" },
            { "id": 40, "text": "Warning Someone: \"The link in that email looks suspicious.\"", "options": ["I see.", "Be careful; it might be a phishing attempt.", "Delete it.", "Don't click it."], "answer": "B", "explanation": "A warning should include the reason for the caution (e.g., 'might be a phishing attempt').", "category": "Functional Language" },
            { "id": 41, "text": "Asking for Permission: \"________________ borrow your HDMI adapter for the presentation?\"", "options": ["I will", "Would you mind if I", "Give me", "Can I have"], "answer": "B", "explanation": "'Would you mind if I' is a polite way to request permission to use someone else's property.", "category": "Functional Language" },
            { "id": 42, "text": "Expressing a Preference: \"Would you prefer a morning or an afternoon meeting?\"", "options": ["I like meetings.", "An afternoon slot would be preferable for me, if that works for you.", "Mornings are bad.", "You choose."], "answer": "B", "explanation": "Using 'preferable' and checking the other person's availability is professional and polite.", "category": "Functional Language" },
            { "id": 43, "text": "Showing Sympathy: \"I'm afraid the project funding was rejected.\"", "options": ["That's too bad.", "I’m very sorry to hear that; is there anything we can do to appeal the decision?", "Try again.", "Oh well."], "answer": "B", "explanation": "Sympathy in a professional setting is most effective when followed by an offer of constructive support.", "category": "Functional Language" },
            { "id": 44, "text": "Making an Introduction: \"Mark, ________________ our English Program Advisor, Pinky.\"", "options": ["look at", "this is", "I want to show you", "meet"], "answer": "B", "explanation": "'This is [Name]' remains the standard introductory phrase in academic and formal settings.", "category": "Functional Language" },
            { "id": 45, "text": "Encouraging a Colleague: \"I'm not sure if the Capstone Exhibition will be a success.\"", "options": ["It has to be.", "I have absolute confidence in the team's preparation!", "It's a lot of work.", "Good luck."], "answer": "B", "explanation": "Expressing confidence in a specific aspect (the preparation) provides meaningful encouragement.", "category": "Functional Language" },
            { "id": 46, "text": "Ending a Conversation: \"It was a pleasure discussing the new IT protocols with you.\"", "options": ["Go now.", "Likewise; I look forward to our next update.", "Goodbye.", "Okay."], "answer": "B", "explanation": "Using 'Likewise' and looking forward to future contact is a standard professional sign-off.", "category": "Functional Language" },
            { "id": 47, "text": "Giving Advice: \"I'm having trouble organizing the student feedback data.\"", "options": ["That's hard.", "You might find it helpful to use Tableau for better visualization.", "Try harder.", "Use a computer."], "answer": "B", "explanation": "Giving a specific, useful suggestion ('use Tableau') is the best way to advise a colleague.", "category": "Functional Language" },
            { "id": 48, "text": "Confirming Information: \"The start date is May 5th, isn't it?\"", "options": ["Yes, that is correct.", "I think so.", "It's in May.", "No."], "answer": "A", "explanation": "'Yes, that is correct' is a formal and clear way to confirm information.", "category": "Functional Language" },
            { "id": 49, "text": "Expressing Surprise: \"We received the 'Best Innovation' award!\"", "options": ["Good.", "That is fantastic news! What an incredible achievement for the team!", "Give me the award.", "I see."], "answer": "B", "explanation": "Professional surprise at positive news should be enthusiastic and acknowledge the team's effort.", "category": "Functional Language" },
            { "id": 50, "text": "Asking for Directions: \"________________ the faculty office?\"", "options": ["Where is", "Could you tell me how to get to", "Can you show me the way to", "All of the above"], "answer": "D", "explanation": "All three phrases are standard and grammatically correct for asking directions.", "category": "Functional Language" },
            { "id": 51, "text": "By the time the Capstone Exhibition opened, the team ________ for months.", "options": ["has prepared", "had been preparing", "prepared", "is preparing"], "answer": "B", "explanation": "Use the Past Perfect Continuous to describe an action that was ongoing up until a specific point in the past.", "category": "Grammar" },
            { "id": 52, "text": "Neither the IT Supervisor nor the English advisors ________ informed of the change.", "options": ["is", "was", "were", "be"], "answer": "C", "explanation": "When using 'neither/nor' with subjects of different numbers, the verb agrees with the closer subject ('advisors' is plural).", "category": "Grammar" },
            { "id": 53, "text": "If I ________ the Business Development Associate role, I would start on May 5th.", "options": ["am offered", "was offered", "were offered", "had been offered"], "answer": "C", "explanation": "In second conditional hypotheticals, 'were' is used for all subjects in the 'if' clause.", "category": "Grammar" },
            { "id": 54, "text": "The student committee ________ working on the SDG curriculum for weeks now.", "options": ["is", "has been", "was", "are"], "answer": "B", "explanation": "Use the Present Perfect Continuous for actions that started in the past and continue to the present moment.", "category": "Grammar" },
            { "id": 55, "text": "Hardly ________ the presentation when the power went out.", "options": ["I had started", "had I started", "I have started", "did I started"], "answer": "B", "explanation": "Sentences starting with negative adverbs like 'hardly' require inversion (Had + Subject + Verb).", "category": "Grammar" },
            { "id": 56, "text": "The educator ________ Capstone Project was a success is very proud.", "options": ["who", "whom", "whose", "that"], "answer": "C", "explanation": "'Whose' is the possessive relative pronoun indicating ownership or relationship.", "category": "Grammar" },
            { "id": 57, "text": "I am not yet accustomed to ________ in a 100% digital environment.", "options": ["work", "working", "worked", "be working"], "answer": "B", "explanation": "'Be accustomed to' is a phrase where 'to' is a preposition, followed by a gerund (-ing).", "category": "Grammar" },
            { "id": 58, "text": "The more you use Tableau, ________ you will understand data visualization.", "options": ["the best", "better", "the better", "more better"], "answer": "C", "explanation": "This follows the double comparative structure: 'The [comparative]..., the [comparative]...'.", "category": "Grammar" },
            { "id": 59, "text": "I wish I ________ more time to review the Campus Connect code last night.", "options": ["have", "had", "had had", "would have"], "answer": "C", "explanation": "Wishes about the past require the Past Perfect (had + past participle).", "category": "Grammar" },
            { "id": 60, "text": "The feedback ________ in the student surveys was overwhelmingly positive.", "options": ["are", "is", "were", "was"], "answer": "D", "explanation": "'Feedback' is an uncountable noun and requires a singular verb.", "category": "Grammar" },
            { "id": 61, "text": "Not only ________ the audit, but she also improved the reporting process.", "options": ["she finished", "did she finish", "she has finished", "finished she"], "answer": "B", "explanation": "Sentences starting with 'Not only' require inversion in the first clause.", "category": "Grammar" },
            { "id": 62, "text": "You ________ better save your Tableau dashboard before closing the app.", "options": ["should", "would", "had", "must"], "answer": "C", "explanation": "'Had better' is the correct fixed idiom for strong advice; 'should better' is incorrect.", "category": "Grammar" },
            { "id": 63, "text": "Despite ________ the youngest advisor, she managed the project perfectly.", "options": ["she was", "being", "was", "she is"], "answer": "B", "explanation": "'Despite' must be followed by a noun or a gerund.", "category": "Grammar" },
            { "id": 64, "text": "This is the school ________ the first MUN program was established.", "options": ["which", "that", "where", "when"], "answer": "C", "explanation": "'Where' is the relative adverb used for locations.", "category": "Grammar" },
            { "id": 65, "text": "The supervisor asked me where ________ the Capstone data.", "options": ["did I store", "I had stored", "had I stored", "do I store"], "answer": "B", "explanation": "Reported questions follow statement word order (Subject + Verb) and do not use 'did'.", "category": "Grammar" },
            { "id": 66, "text": "The curriculum ________ by the advisor was aligned with the SDGs.", "options": ["designing", "designed", "designs", "was designed"], "answer": "B", "explanation": "This is a reduced relative clause using the past participle 'designed'.", "category": "Grammar" },
            { "id": 67, "text": "Unless the software ________ crashing, we cannot finish the report.", "options": ["stops", "stop", "will stop", "stopped"], "answer": "A", "explanation": "In conditional 'unless' clauses, use the Present Simple to refer to future possibilities.", "category": "Grammar" },
            { "id": 68, "text": "I’d rather the team ________ focus on Project-Based Learning this year.", "options": ["don't", "didn't", "not", "wouldn't"], "answer": "B", "explanation": "After 'I'd rather [subject]', use the Past Simple for preferences about the present/future.", "category": "Grammar" },
            { "id": 69, "text": "It’s high time the students ________ applying their theoretical knowledge.", "options": ["start", "to start", "started", "are starting"], "answer": "C", "explanation": "'It's high time' is a fixed structure followed by the Past Simple.", "category": "Grammar" },
            { "id": 70, "text": "She served ________ an English Program Advisor for several years.", "options": ["like", "as", "same", "similar"], "answer": "B", "explanation": "Use 'as' to indicate a person's actual role, job, or function.", "category": "Grammar" },
            { "id": 71, "text": "The advisors are looking forward ________ the next Capstone Exhibition.", "options": ["attend", "to attend", "to attending", "attending"], "answer": "C", "explanation": "'Look forward to' must be followed by a gerund (-ing).", "category": "Grammar" },
            { "id": 72, "text": "We ________ for the school-wide launch since early February.", "options": ["plan", "are planning", "have been planning", "were planning"], "answer": "C", "explanation": "Use the Present Perfect Continuous for actions that started in the past and are still relevant or ongoing.", "category": "Grammar" },

            { "id": 78, "text": "Passage B: 'The SDGs in the Classroom.' Why is SDG literacy important for the next generation?", "options": ["To pass exams", "To ensure sufficient education and sustainability awareness", "To save money", "To replace traditional math"], "answer": "B", "explanation": "Integrating SDGs ensures students are literate in sustainability and real-world challenges.", "category": "Reading — Detail" },

            { "id": 80, "text": "Passage C: 'Project-Based Learning (PBL).' According to the text, why is PBL vital?", "options": ["It is easier than theory", "It helps students apply theory to real-world challenges", "It requires no teachers", "It is a new trend"], "answer": "B", "explanation": "The text highlights applying theoretical concepts to practice as the primary value of PBL.", "category": "Reading — Detail" },

            { "id": 82, "text": "Passage D: 'Data Visualization.' What is the primary purpose of using tools like Tableau?", "options": ["To make pretty pictures", "To transform complex datasets into actionable insights", "To replace Excel", "To track attendance"], "answer": "B", "explanation": "Data visualization is used to make complex data understandable and useful for decision-making.", "category": "Reading — Purpose" },

            { "id": 84, "text": "Passage E: 'Career Transitions.' Navigating a new professional role requires:", "options": ["Luck", "Adaptability and preparation", "A high salary", "Strict routine"], "answer": "B", "explanation": "The passage implies that preparing for a transition, like a new start date, requires adaptability.", "category": "Reading — Inference" },

            { "id": 86, "text": "Passage F: 'Model United Nations.' What skill is NOT primarily mentioned as being trained in MUN?", "options": ["Diplomacy", "Public Speaking", "Advanced Calculus", "Policy-making"], "answer": "C", "explanation": "MUN focuses on diplomacy and policy, not mathematics like calculus.", "category": "Reading — Detail" },

            { "id": 97, "text": "What does 'acidification' of the ocean lead to?", "options": ["More fish", "Coral bleaching", "Warmer air", "Clearer water"], "answer": "B", "explanation": "Chemical changes in the water (acidification) are a direct cause of reef damage.", "category": "Reading — Detail" },
            { "id": 98, "text": "The 'loop' in habit formation refers to:", "options": ["A physical circle", "A recurring neurological pattern", "A mistake", "A rope"], "answer": "B", "explanation": "The neurological loop describes the repeated sequence of cue, routine, and reward.", "category": "Reading — Terminology" },
            { "id": 99, "text": "In a formal setting, what is 'interjecting'?", "options": ["Leaving the room", "Interrupting politely to add a point", "Shouting", "Sleeping"], "answer": "B", "explanation": "Interjecting is the formal term for joining a conversation or debate respectfully.", "category": "Reading — Vocabulary" },

        ];

        let studentName = "";
        let answers = {};

        // DOM Elements
        const landingPage = document.getElementById('landing-page');
        const onboarding = document.getElementById('onboarding');
        const examInterface = document.getElementById('exam-interface');
        const resultsPage = document.getElementById('results-page');
        const studentInput = document.getElementById('student-name');
        const startBtn = document.getElementById('start-btn');

        // Logic: Onboarding
        studentInput.addEventListener('input', (e) => {
            studentName = e.target.value.trim();
            if (studentName.length > 2) {
                startBtn.disabled = false;
                startBtn.classList.remove('bg-gray-300', 'text-gray-500', 'cursor-not-allowed');
                startBtn.classList.add('bg-ink', 'text-white', 'hover:bg-accent');
            } else {
                startBtn.disabled = true;
                startBtn.classList.add('bg-gray-300', 'text-gray-500', 'cursor-not-allowed');
            }
        });

        startBtn.onclick = () => {
            onboarding.classList.add('hidden');
            examInterface.classList.remove('hidden');
            document.getElementById('current-user-tag').innerText = `Candidate: ${studentName}`;
            document.getElementById('student-display').innerText = studentName;
            document.getElementById('student-display').classList.remove('hidden');
            renderQuestions();
            window.scrollTo(0,0);
        };

        function showOnboarding() {
            landingPage.classList.add('hidden');
            onboarding.classList.remove('hidden');
        }

        function hideOnboarding() {
            onboarding.classList.add('hidden');
            landingPage.classList.remove('hidden');
        }

        // Logic: Exam Rendering
        function renderQuestions() {
            const container = document.getElementById('questions-container');
            container.innerHTML = TEST_1_DATA.map((q, idx) => `
                <div class="bg-white p-8 rounded-lg shadow-sm border border-gray-100">
                    <div class="flex justify-between items-start mb-4">
                        <span class="text-accent font-bold text-sm tracking-widest uppercase">${q.category}</span>
                        <span class="text-gray-300 font-bold">#${q.id}</span>
                    </div>
                    <p class="text-xl mb-6 leading-relaxed">${q.text}</p>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        ${q.options.map((opt, i) => {
                            const letter = String.fromCharCode(65 + i);
                            return `
                                <button onclick="selectOption(${q.id}, '${letter}')" 
                                        id="q${q.id}-opt${letter}"
                                        class="btn-option text-left p-4 border-2 border-gray-100 rounded-lg hover:border-accent transition-all flex items-center">
                                    <span class="w-8 h-8 flex items-center justify-center rounded-full bg-paper mr-3 font-bold text-sm border border-gray-200">${letter}</span>
                                    ${opt}
                                </button>
                            `;
                        }).join('')}
                    </div>
                </div>
            `).join('');
        }

        function selectOption(qId, letter) {
            // Clear previous selection in this question group
            ['A', 'B', 'C', 'D'].forEach(l => {
                document.getElementById(`q${qId}-opt${l}`).classList.remove('selected');
            });
            // Select new
            document.getElementById(`q${qId}-opt${letter}`).classList.add('selected');
            answers[qId] = letter;
        }

        // Logic: Submission & Pedagogy
        async function submitExam() {
            if (!confirm("Are you sure you want to submit your answers?")) return;

            let score = 0;
            TEST_1_DATA.forEach(q => {
                if (answers[q.id] === q.answer) score++;
            });

            examInterface.classList.add('hidden');
            resultsPage.classList.remove('hidden');
            document.getElementById('score-circle').innerText = `${score} / ${TEST_1_DATA.length}`;
            
            renderReview();
            await sendScoreToTeacher(score);
            window.scrollTo(0,0);
        }

        function renderReview() {
            const container = document.getElementById('review-container');
            container.innerHTML = TEST_1_DATA.map(q => {
                const isCorrect = answers[q.id] === q.answer;
                return `
                    <div class="p-6 rounded-lg ${isCorrect ? 'correct-bg' : 'incorrect-bg'} mb-4">
                        <p class="font-bold mb-2">Question ${q.id}: ${isCorrect ? '✓ Correct' : '✗ Incorrect'}</p>
                        <p class="mb-4">${q.text}</p>
                        <p class="text-sm"><strong>Your Answer:</strong> ${answers[q.id] || 'None'} | <strong>Correct Answer:</strong> ${q.answer}</p>
                        <div class="mt-4 p-3 bg-white bg-opacity-50 rounded italic text-sm">
                            <strong>Explanation:</strong> ${q.explanation}
                        </div>
                    </div>
                `;
            }).join('');
        }

        async function sendScoreToTeacher(score) {
            const statusBox = document.getElementById('submission-status');
            
            try {
                const response = await fetch(`https://formspree.io/f/${FORMSPREE_ID}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        student: studentName,
                        test: "Practice Test 1",
                        score: `${score}/100`,
                        percentage: `${(score/TEST_1_DATA.length)*100}%`
                    })
                });

                if (response.ok) {
                    statusBox.innerHTML = "✅ Score successfully logged and sent to instructor.";
                    statusBox.classList.add('text-green-600');
                } else {
                    throw new Error();
                }
            } catch (err) {
                statusBox.innerHTML = "⚠️ Error sending score. Please screenshot this page for your instructor.";
                statusBox.classList.add('text-red-600');
            }
        }
    </script>
